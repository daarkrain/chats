<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="img" src="" alt="" />
  <script src="js/images.js"></script>
  <script>
    const pool = IMAGES.filter(f => /\.(jpg|jpeg|png|gif|webp|avif|svg)$/i.test(f));
    const idx = Math.floor(Math.random() * pool.length);
    document.getElementById('img').src = 'images/' + pool[idx];
  </script>
</body>
</html>
